<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Devid Niukkanen — контакты</title>
  <meta name="description" content="Контакты и ссылки Devid Niukkanen">
  <style>
    :root {
      --bg: #0a0b0e;
      --card: rgba(255,255,255,.065);
      --card-hover: rgba(255,255,255,.11);
      --text: #f4f5f7;
      --muted: #a5a9b2;
      --line: rgba(255,255,255,.13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -5%, #30343c 0, transparent 38%),
        linear-gradient(180deg, #0b0d11, #07080a);
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    main { width: min(100%, 460px); text-align: center; }
    .logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      margin: 0 auto 20px;
      border-radius: 28px;
      filter: invert(1);
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      letter-spacing: -1px;
    }
    .handle {
      margin: 7px 0 28px;
      color: var(--muted);
      font-size: 16px;
    }
    .links { display: grid; gap: 12px; }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
      backdrop-filter: blur(14px);
    }
    a:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(255,255,255,.22);
    }
    .left { display: flex; align-items: center; gap: 12px; }
    .icon {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.09);
      font-size: 16px;
    }
    .arrow { color: #8f949e; font-size: 18px; }
    footer { margin-top: 26px; color: #656a74; font-size: 12px; }
  </style>
</head>
